name: iPad uygulamasını derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode sürümü
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: XcodeGen kur ve projeyi üret
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Derle (imzasız)
        run: |
          set -o pipefail
          xcodebuild -project CivCevirmen.xcodeproj -target CivCevirmen \
            -sdk iphoneos -configuration Release \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: IPA paketle
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/CivCevirmen.app Payload/
          zip -qry CivCevirmen.ipa Payload
          ls -la CivCevirmen.ipa

      - name: Sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Civ Çevirmen (derleme ${{ github.run_number }})
          files: CivCevirmen.ipa
          make_latest: true
